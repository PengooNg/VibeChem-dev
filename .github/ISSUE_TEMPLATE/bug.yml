name: Bug report
description: Something does not work, or a result looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. If a number looks wrong but no error appeared, please tick the box below: silent wrong results are our most serious bugs.
  - type: checkboxes
    id: silent-wrong-result
    attributes:
      label: Kind of problem
      options:
        - label: The result looks wrong, but no error was shown (silent wrong result or data leakage)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, starting from opening the app or project.
      placeholder: |
        1. Open a CSV file with 120 NIR spectra
        2. Add SNV, then PLS with 8 components
        3. Run the pipeline
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Include the error message if one appeared.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of "Copy diagnostics" (versions, OS, last errors, run and node IDs). It contains no user data.
      render: text
    validations:
      required: true
  - type: textarea
    id: pipeline
    attributes:
      label: Pipeline file (optional)
      description: Attach the pipeline file if you can share it. Please don't attach confidential data.
