name: Feature request
description: Suggest an improvement to the app or library.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it could work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other tools or workarounds you use now.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data import and export
        - Preprocessing and models
        - Pipeline canvas and UI
        - Reports and plots
        - Python library or CLI
        - Installation and performance
        - Other
