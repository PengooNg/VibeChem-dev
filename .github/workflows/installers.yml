# SPDX-License-Identifier: GPL-3.0-or-later
# Installer builds (TECH_STACK.md §8). Skeleton from T0.06: until T0.11 adds
# electron-builder + the PyInstaller engine and the `/health` smoke test, the
# build job only bundles the app (`pnpm --dir app build`) on 3 OS.
# Runs on PRs that touch packaging paths or carry the `build-installers` label,
# and on pushes to `phase-*` that touch those paths.
name: installers

on:
  pull_request:
    branches: [main, "phase-*"]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: ["phase-*"]
    paths:
      - "app/**"
      - "packages/engine/**"
      - "packages/native/**"
      - ".github/workflows/installers.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: installers gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-installers') }}
        run: |
          # Pushes are already path-filtered by the trigger.
          if [ "$EVENT" = push ] || [ "$HAS_LABEL" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          if printf '%s\n' "$files" | grep -Eq '^(app/|packages/engine/|packages/native/|\.github/workflows/installers\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: installers (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - name: Bundle the app (installer + smoke test arrive in T0.11)
        run: pnpm --dir app build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-bundle-${{ matrix.name }}
          path: app/out/
          retention-days: 14
