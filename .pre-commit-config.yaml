# Install once per clone: `uv run pre-commit install`.
# Local hooks run the ruff version pinned in uv.lock (no separate hook pin to keep in sync).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
