# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "vibechem-core"
version = "0.0.0"
description = "VibeChem science library: spectral data model, readers, blocks, metrics"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "jcamp>=1.3.2,<1.4",
    "numpy>=2.5",
    "openpyxl>=3.1.5,<3.2",
    "scikit-learn>=1.9,<1.10",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
