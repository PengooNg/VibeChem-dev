# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "vibechem-engine"
version = "0.0.0"
description = "VibeChem pipeline engine: graph, compiler, executor, API, CLI"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149,<0.150",
    "loky>=3.7.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.13,<2.14",
    "threadpoolctl>=3.8.0",
    "uvicorn>=0.54.0",
    "vibechem-core",
]

[tool.uv.sources]
vibechem-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
