# Workspace root (virtual: no [project]). Members are the Python packages.
# Tool settings follow scientific-python/cookie (BSD-3-Clause) recommendations,
# adapted to TECH_STACK.md §1.3 and §4.

[tool.uv.workspace]
members = ["packages/core", "packages/engine", "packages/native"]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright[nodejs]",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]  # vendored skills (THIRD_PARTY.md)
src = ["packages/core/src", "packages/engine/src", "scripts"]

[tool.ruff.lint]
extend-select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EXE",  # flake8-executable
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy-specific rules
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (TECH_STACK §4: no print)
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "PLR09",    # too many arguments/branches/...: judged in review instead
    "PLR2004",  # magic values: common in numeric tests
]
allowed-confusables = ["–"]  # en dash in method names (Savitzky–Golay, Kennard–Stone)

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]  # command-line scripts print to the terminal
"**/tests/**" = ["T20"]
"scripts/tests/**" = ["T20", "PT009", "PT027"]  # unittest-style tests (stdlib only)

[tool.pyright]
include = ["packages/core/src", "packages/core/tests", "packages/engine/src", "packages/engine/tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["packages/core/tests", "packages/engine/tests", "scripts/tests"]
markers = ["slow: long-running test, skipped by `check.py --fast`"]
