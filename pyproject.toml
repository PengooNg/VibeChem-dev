# Workspace root (virtual: no [project]). Members are the Python packages.
# Tool settings follow scientific-python/cookie (BSD-3-Clause) recommendations,
# adapted to TECH_STACK.md §1.3 and §4.

[tool.uv.workspace]
members = ["packages/core", "packages/engine", "packages/native"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<2.16.1",
    "hypothesis",
    "import-linter",
    "loky>=3.7.0",
    "pre-commit",
    "pyinstaller>=6.21,<6.22",
    "pyright[nodejs]",
    "pytest",
    "pytest-cov",
    "pytest-regressions",
    "ruff",
    "threadpoolctl>=3.8.0",
]

[tool.uv]
# cloudpickle (from loky) 3.1.3 was released 2026-11-18, less than two weeks before T0.13.
# narwhals (from scikit-learn) 2.29.0 was released 2026-11-17, less than two weeks before T1.02b.
constraint-dependencies = ["cloudpickle<3.1.3", "narwhals<2.29.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]  # vendored skills (THIRD_PARTY.md)
src = ["packages/core/src", "packages/engine/src", "packages/native/python", "scripts"]

[tool.ruff.lint]
extend-select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EXE",  # flake8-executable
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy-specific rules
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (TECH_STACK §4: no print)
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "PLR09",    # too many arguments/branches/...: judged in review instead
    "PLR2004",  # magic values: common in numeric tests
]
allowed-confusables = ["–"]  # en dash in method names (Savitzky–Golay, Kennard–Stone)

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]  # command-line scripts print to the terminal
"**/tests/**" = ["T20"]
"scripts/tests/**" = ["T20", "PT009", "PT027"]  # unittest-style tests (stdlib only)

[tool.pyright]
include = [
    "packages/core/src", "packages/core/tests",
    "packages/engine/src", "packages/engine/tests",
    "packages/native/python", "packages/native/tests",
    "scripts",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["packages/core/tests", "packages/engine/tests", "packages/native/tests", "scripts/tests"]
markers = ["slow: long-running test, skipped by `check.py --fast`"]

# Package boundaries (TECH_STACK.md §3.1), checked by `check.py` (summary line "boundaries").
# Only Python packages appear here; app/renderer and app/main are TypeScript.
[tool.importlinter]
root_packages = ["vibechem_core", "vibechem_engine", "vibechem_native"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core"
name = "vibechem_core never imports vibechem_engine or fastapi (TECH_STACK.md 3.1)"
type = "forbidden"
source_modules = ["vibechem_core"]
forbidden_modules = ["vibechem_engine", "fastapi"]

[[tool.importlinter.contracts]]
id = "native"
name = "vibechem_native never imports vibechem_engine (TECH_STACK.md 3.1)"
type = "forbidden"
source_modules = ["vibechem_native"]
forbidden_modules = ["vibechem_engine"]
